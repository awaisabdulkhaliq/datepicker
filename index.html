<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom DatePicker</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="page">
        <section class="demo-card">
            <p class="eyebrow">Reusable component demo</p>
            <h1>Simple DatePicker</h1>
            <p class="description">
                A lightweight datepicker built with plain HTML, CSS, and JavaScript.
                It supports opening and closing the calendar, month navigation, and selecting a date.
            </p>

            <label class="field-label" for="booking-date">Choose a date</label>
            <div id="booking-date" class="datepicker-host"></div>

            <p class="helper-text" id="selection-output">No date selected yet.</p>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
